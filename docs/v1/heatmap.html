<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heatmap · LeetCode Journey</title>
<meta name="description" content="GitHub-style contribution calendar of your daily LeetCode activity.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232ee6c4%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%2305130f%22 font-family=%22monospace%22>&lt;/&gt;</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar-backdrop"></div>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">&lt;/&gt;</div>
      <div class="brand-text">
        <div class="brand-title">LeetCode Journey</div>
        <div class="brand-sub" id="sidebar-username">@loading</div>
      </div>
    </div>

    <div class="nav-section-label">Overview</div>
    <ul class="nav-list">
      <li><a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a></li>
      <li><a href="analytics.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        Analytics
      </a></li>
    </ul>

    <div class="nav-section-label">Explore</div>
    <ul class="nav-list">
      <li><a href="problems.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h11M9 12h11M9 20h11"/><circle cx="4" cy="4" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="4" cy="20" r="1.6"/></svg>
        Problems
      </a></li>
      <li><a href="heatmap.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 3v3M16 3v3"/></svg>
        Heatmap
      </a></li>
      <li><a href="submissions.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 13h6M9 17h6"/></svg>
        Submissions
      </a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="streak-terminal">
        <div><span class="term-prompt">$</span> streak --current</div>
        <div id="term-current-streak">…<span class="term-cursor"></span></div>
      </div>
      <button class="repo-link-btn" data-copy-repo>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 9a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-1"/><path d="M15 15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h1"/></svg>
        Copy repo link
      </button>
    </div>
  </aside>

  <div class="main-col">
    <header class="navbar">
      <div class="navbar-left">
        <button class="menu-toggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <div class="page-title">Heatmap</div>
          <div class="page-subtitle">Your daily contribution calendar</div>
        </div>
      </div>
      <div class="navbar-right">
        <div class="last-updated-badge"><span class="dot"></span><span>Updated <span id="last-updated-text">—</span></span></div>
        <button class="icon-btn" data-theme-toggle title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
      </div>
    </header>

    <main class="page-content">

      <div class="stats-grid" id="heatmap-stats"></div>

      <div class="card panel">
        <div class="toolbar" style="justify-content: space-between;">
          <div class="section-title" style="margin-bottom:0;">Contribution calendar</div>
          <div class="year-chips" id="year-chips"></div>
        </div>
        <div class="section-desc">Hover any cell for that day's submission count</div>
        <div class="heatmap-scroll">
          <div id="heatmap-container"></div>
        </div>
        <div class="heatmap-legend">
          Less
          <div class="heatmap-cell"></div>
          <div class="heatmap-cell" data-level="1"></div>
          <div class="heatmap-cell" data-level="2"></div>
          <div class="heatmap-cell" data-level="3"></div>
          <div class="heatmap-cell" data-level="4"></div>
          More
        </div>
      </div>

    </main>
  </div>
</div>

<div class="hm-tooltip" id="hm-tooltip"></div>
<button class="scroll-top-btn" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="js/app.js"></script>
<script src="js/github.js"></script>
<script src="js/heatmap.js"></script>
</body>
</html>
