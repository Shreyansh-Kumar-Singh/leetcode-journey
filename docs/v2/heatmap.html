            <div style="flex:1"></div>

            <div class="card">

                margin-bottom:8px;

                <div id="term-current-streak" style="

                ">

                </div>

                <div style="
                color:var(--green);
                margin-top:6px;
                ">

                    Keep Coding 🔥

                </div>

            </div>

        </aside>

        <!-- ===================== MAIN ===================== -->

        <div class="main-col">

            <header class="navbar">

                <button class="menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                    <div class="page-title">

                        Heatmap

                    </div>

                    <div class="page-subtitle">

                    </div>

                </div>

                <div style="
                display:flex;
                align-items:center;
                gap:12px;
                ">

                    <div class="card" style="
                    padding:10px 16px;
                    ">

                        Updated

                        <strong id="last-updated-text">

                            --

                        </strong>

                    </div>

                    <button class="icon-btn" data-theme-toggle>

                        🌙

                    </button>

                </div>

            </header>

            <main class="page-content">



      <div class="stats-grid" id="heatmap-stats"></div>

      <div class="card panel">
        <div class="toolbar" style="justify-content: space-between;">
          <div class="section-title" style="margin-bottom:0;">Contribution calendar</div>
          <div class="year-chips" id="year-chips"></div>
        </div>
        <div class="section-desc">Hover any cell for that day's submission count</div>
        <div class="heatmap-scroll">
          <div id="heatmap-container"></div>
        </div>
        <div class="heatmap-legend">
          Less
          <div class="heatmap-cell"></div>
          <div class="heatmap-cell" data-level="1"></div>
          <div class="heatmap-cell" data-level="2"></div>
          <div class="heatmap-cell" data-level="3"></div>
          <div class="heatmap-cell" data-level="4"></div>
          More
        </div>
      </div>

      <div class="hm-tooltip" id="hm-tooltip"></div>

    

            </main>

        </div>

    </div>

    <button class="scroll-top-btn" id="scrollTop">
        ↑

    <script src="js/app.js"></script>
