<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeetCode Journey | Submissions</title>

    <meta name="description"
        content="Your full submission history">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="sidebar-backdrop"></div>

    <div class="app-shell">

        <!-- ===================== SIDEBAR ===================== -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-mark">
                    &lt;/&gt;
                </div>

                <div>

                    <div class="brand-title">
                        LeetCode Journey
                    </div>

                    <div class="brand-sub" id="sidebar-username">
                        @loading...
                    </div>

                </div>

            </div>

            <div class="nav-section-label">
                OVERVIEW
            </div>

            <ul class="nav-list">

                <li>

                    <a href="index.html" class="nav-item">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            <rect x="3" y="3" width="7" height="9" rx="2" />

                            <rect x="14" y="3" width="7" height="5" rx="2" />

                            <rect x="14" y="12" width="7" height="9" rx="2" />

                            <rect x="3" y="16" width="7" height="5" rx="2" />

                        </svg>

                        Dashboard

                    </a>

                </li>

                <li>

                    <a href="analytics.html" class="nav-item">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            <path d="M3 3v18h18" />
                            <path d="M7 15l4-5 3 3 5-7" />

                        </svg>

                        Analytics

                    </a>

                </li>

            </ul>

            <div class="nav-section-label">

                EXPLORE

            </div>

            <ul class="nav-list">

                <li>

                    <a href="problems.html" class="nav-item">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            <path d="M9 4h11" />

                            <path d="M9 12h11" />

                            <path d="M9 20h11" />

                            <circle cx="4" cy="4" r="1.6" />

                            <circle cx="4" cy="12" r="1.6" />

                            <circle cx="4" cy="20" r="1.6" />

                        </svg>

                        Problems

                    </a>

                </li>

                <li>

                    <a href="heatmap.html" class="nav-item">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            <rect x="3" y="4" width="18" height="17" rx="2" />

                            <path d="M3 9h18" />

                            <path d="M8 3v3" />

                            <path d="M16 3v3" />

                        </svg>

                        Heatmap

                    </a>

                </li>

                <li>

                    <a href="submissions.html" class="nav-item active">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            <path d="M14 3v5h5" />

                            <path d="M6 3h8l5 5v13H6z" />

                            <path d="M9 13h6" />

                            <path d="M9 17h6" />

                        </svg>

                        Submissions

                    </a>

                </li>

            </ul>

            <div style="flex:1"></div>

            <div class="card">

                <div style="
                color:var(--muted);
                font-size:13px;
                margin-bottom:8px;
                ">

                    CURRENT STREAK

                </div>

                <div id="term-current-streak" style="
                font-size:34px;
                font-weight:800;
                ">

                    ...

                </div>

                <div style="
                color:var(--green);
                margin-top:6px;
                ">

                    Keep Coding 🔥

                </div>

            </div>

        </aside>

        <!-- ===================== MAIN ===================== -->

        <div class="main-col">

            <header class="navbar">

                <button class="menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <div>

                    <div class="page-title">

                        Submissions

                    </div>

                    <div class="page-subtitle" id="submissions-count-subtitle">

                        Your full submission history

                    </div>

                </div>

                <div style="
                display:flex;
                align-items:center;
                gap:12px;
                ">

                    <div class="card" style="
                    padding:10px 16px;
                    ">

                        Updated

                        <strong id="last-updated-text">

                            --

                        </strong>

                    </div>

                    <button class="icon-btn" data-theme-toggle>

                        🌙

                    </button>

                </div>

            </header>

            <main class="page-content">



      <div class="stats-grid" id="submissions-stats"></div>

      <div class="card panel">
        <div class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="search-input" placeholder="Search by problem name…">
          </div>
          <select id="filter-language">
            <option value="">All languages</option>
          </select>
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="Accepted">Accepted</option>
            <option value="Wrong Answer">Wrong Answer</option>
            <option value="Time Limit Exceeded">Time Limit Exceeded</option>
            <option value="Runtime Error">Runtime Error</option>
            <option value="Memory Limit Exceeded">Memory Limit Exceeded</option>
            <option value="Compile Error">Compile Error</option>
          </select>
          <select id="filter-date">
            <option value="">All time</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last year</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-sort="submission_id">ID<span class="sort-arrow"></span></th>
                <th data-sort="question">Problem<span class="sort-arrow"></span></th>
                <th data-sort="language_name">Language<span class="sort-arrow"></span></th>
                <th data-sort="runtime">Runtime<span class="sort-arrow"></span></th>
                <th data-sort="memory">Memory<span class="sort-arrow"></span></th>
                <th data-sort="status_display">Status<span class="sort-arrow"></span></th>
                <th data-sort="timestamp">Submitted<span class="sort-arrow"></span></th>
              </tr>
            </thead>
            <tbody id="submissions-tbody">
              <tr><td colspan="7"><div class="skeleton skel-row"></div></td></tr>
              <tr><td colspan="7"><div class="skeleton skel-row"></div></td></tr>
              <tr><td colspan="7"><div class="skeleton skel-row"></div></td></tr>
              <tr><td colspan="7"><div class="skeleton skel-row"></div></td></tr>
              <tr><td colspan="7"><div class="skeleton skel-row"></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination">
          <div class="pagination-info" id="pagination-info"></div>
          <div class="pagination-controls" id="pagination-controls"></div>
        </div>
      </div>
    

            </main>

        </div>

    </div>

    <button class="scroll-top-btn" id="scrollTop">
        ↑
    </button>

    <script src="js/app.js"></script>
    <script src="js/github.js"></script>
    <script src="js/submissions.js"></script>

</body>

</html>
